apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hodlfun

resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - websocket-deployment.yaml
  - indexer-deployment.yaml
  - worker-deployment.yaml
  - hpa.yaml
  - network-policy.yaml
  - ingress.yaml
  - pod-monitoring.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: hodlfun-platform

images:
  - name: hodlfun/api
    newName: gcr.io/hodlfun/api
    newTag: latest
  - name: hodlfun/websocket
    newName: gcr.io/hodlfun/websocket
    newTag: latest
  - name: hodlfun/indexer
    newName: gcr.io/hodlfun/indexer
    newTag: latest
  - name: hodlfun/worker
    newName: gcr.io/hodlfun/worker
    newTag: latest
