apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: hodlfun
data:
  alerts.yml: |
    groups:
      - name: hodlfun-api
        rules:
          - alert: HighErrorRate
            expr: |
              (
                sum(rate(http_requests_total{job="hodlfun-api", status=~"5.."}[5m]))
                /
                sum(rate(http_requests_total{job="hodlfun-api"}[5m]))
              ) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate on API"
              description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

          - alert: HighLatency
            expr: |
              histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="hodlfun-api"}[5m])) by (le))
              > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High API latency"
              description: "95th percentile latency is {{ $value | humanizeDuration }}"

          - alert: APIDown
            expr: up{job="hodlfun-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "API is down"
              description: "API service has been down for more than 1 minute"

      - name: hodlfun-indexer
        rules:
          - alert: IndexerBehind
            expr: |
              (chain_head_block - indexer_last_processed_block) > 100
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Indexer falling behind"
              description: "Indexer is {{ $value }} blocks behind chain head"

          - alert: IndexerDown
            expr: up{job="hodlfun-indexer"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Indexer is down"
              description: "Indexer service has been down for more than 1 minute"

          - alert: IndexerNotProcessing
            expr: |
              increase(indexer_events_processed_total[5m]) == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Indexer not processing events"
              description: "No events have been processed in the last 10 minutes"

      - name: hodlfun-worker
        rules:
          - alert: QueueBacklogHigh
            expr: |
              sum(queue_jobs_waiting) > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High queue backlog"
              description: "{{ $value }} jobs are waiting in queues"

          - alert: JobFailureRate
            expr: |
              (
                sum(rate(queue_jobs_failed_total[5m]))
                /
                sum(rate(queue_jobs_completed_total[5m]) + rate(queue_jobs_failed_total[5m]))
              ) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High job failure rate"
              description: "Job failure rate is {{ $value | humanizePercentage }}"

      - name: hodlfun-websocket
        rules:
          - alert: WebSocketConnectionsHigh
            expr: |
              sum(websocket_active_connections) > 10000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High WebSocket connections"
              description: "{{ $value }} active WebSocket connections"

          - alert: WebSocketDown
            expr: up{job="hodlfun-websocket"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "WebSocket service is down"
              description: "WebSocket service has been down for more than 1 minute"

      - name: hodlfun-infrastructure
        rules:
          - alert: HighCPUUsage
            expr: |
              (
                100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              ) > 80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage"
              description: "CPU usage is {{ $value | humanize }}%"

          - alert: HighMemoryUsage
            expr: |
              (
                1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
              ) * 100 > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Memory usage is {{ $value | humanize }}%"

          - alert: DiskSpaceLow
            expr: |
              (
                1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)
              ) * 100 > 80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Low disk space"
              description: "Disk usage is {{ $value | humanize }}%"

          - alert: DatabaseConnectionsHigh
            expr: |
              pg_stat_activity_count > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High database connections"
              description: "{{ $value }} database connections active"

          - alert: RedisMemoryHigh
            expr: |
              redis_memory_used_bytes / redis_memory_max_bytes > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High Redis memory usage"
              description: "Redis memory usage is {{ $value | humanizePercentage }}"
